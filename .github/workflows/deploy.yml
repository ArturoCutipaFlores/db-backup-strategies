# ==================================================================
# deploy.yml — CI/CD: build + tests + deploy a Render
# ------------------------------------------------------------------
# 1. test   : levanta PostgreSQL en un contenedor de servicio, arranca la API
#             y ejecuta pruebas de humo del CRUD con curl + jq.
# 2. docker : construye la imagen Docker para validar el Dockerfile.
# 3. deploy : (solo push a main) dispara el Deploy Hook de Render.
#
# Secret requerido: RENDER_DEPLOY_HOOK
# ==================================================================
name: CI/CD - Build, test y deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Evita dos despliegues simultáneos de la misma rama
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  test:
    name: Build y tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Base de datos efímera solo para las pruebas (se destruye al terminar)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasks_test
      DB_SSL: "false"
      PORT: 3000
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis JavaScript
        run: npm run check

      - name: Verificar sintaxis de scripts bash
        working-directory: .
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK  $f"
          done

      - name: Arrancar la API en segundo plano
        run: |
          nohup node index.js > ../server.log 2>&1 &
          # Espera hasta 30 s a que /api/health responda
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "API lista tras ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::La API no respondió en 30 s"; exit 1

      - name: Pruebas de humo del CRUD
        run: |
          set -euo pipefail
          BASE=http://localhost:3000/api/tasks

          echo "→ Health check"
          curl -fsS http://localhost:3000/api/health | jq .

          echo "→ El frontend se sirve en /"
          curl -fsS http://localhost:3000/ | grep -q "Gestor de Tareas"

          echo "→ POST crea una tarea"
          ID=$(curl -fsS -X POST "$BASE" -H 'Content-Type: application/json' \
                -d '{"title":"Tarea CI","description":"creada por GitHub Actions"}' | jq -r '.id')
          [ "$ID" != "null" ] && echo "  id=$ID"

          echo "→ GET lista contiene la tarea"
          curl -fsS "$BASE" | jq -e --argjson id "$ID" 'map(.id) | index($id) != null' > /dev/null

          echo "→ PUT marca como completada"
          curl -fsS -X PUT "$BASE/$ID" -H 'Content-Type: application/json' \
            -d '{"status":"completada"}' | jq -e '.status == "completada"' > /dev/null

          echo "→ GET con filtro ?status=completada"
          curl -fsS "$BASE?status=completada" | jq -e 'all(.status == "completada")' > /dev/null

          echo "→ POST sin título devuelve 400"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE" \
                  -H 'Content-Type: application/json' -d '{"title":""}')
          [ "$CODE" = "400" ]

          echo "→ PUT con estado inválido devuelve 400"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$BASE/$ID" \
                  -H 'Content-Type: application/json' -d '{"status":"otro"}')
          [ "$CODE" = "400" ]

          echo "→ DELETE elimina la tarea"
          curl -fsS -X DELETE "$BASE/$ID" | jq .

          echo "→ GET de la tarea eliminada devuelve 404"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/$ID")
          [ "$CODE" = "404" ]

          echo "✅ Todas las pruebas de humo pasaron"

      - name: Mostrar logs del servidor si algo falló
        if: failure()
        working-directory: .
        run: cat server.log || true

  # ----------------------------------------------------------------
  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t db-backup-strategies:${{ github.sha }} .

      - name: Verificar herramientas de backup dentro de la imagen
        run: |
          docker run --rm --entrypoint sh db-backup-strategies:${{ github.sha }} \
            -c 'node --version && pg_dump --version && psql --version && bash --version | head -1'

  # ----------------------------------------------------------------
  deploy:
    name: Deploy a Render
    needs: [test, docker]
    # Solo despliega desde main (push o ejecución manual), nunca desde un PR
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Disparar Deploy Hook de Render
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::El secret RENDER_DEPLOY_HOOK no está configurado; se omite el deploy."
            exit 0
          fi
          # El Deploy Hook es una URL secreta: GitHub la enmascara en los logs.
          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK")
          echo "Respuesta de Render: HTTP $HTTP_CODE"
          cat response.json; echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render rechazó el Deploy Hook (HTTP $HTTP_CODE)"; exit 1
          fi
          {
            echo "### 🚀 Deploy disparado en Render"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Autor: ${GITHUB_ACTOR}"
            echo "- Fecha: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
